<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <p class="intro">Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since 1966, when designers at Letraset and James Mosley.<br>Letraset and James Mosley<br><br>Lorem Ipsum is simply dummy</p>

    <div class="form-container">
      <form action="#" method="POST">
      <h3>Let's Do It</h3>
      <label for="fname">First Name</label>
      <input type="text" id="fname" name="fname" required />
      <label for="lname">Last Name</label>
      <input type="text" id="lname" name="lname" required/>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required/>
      <label for="phone">Contact</label>
      <input type="text" id="phone" name="phone" required/>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required/>
      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" required/>
    </div>
    <button type="submit">Create an Account</button>
    </form>
    <p class="login-link">Already have an account? <a href="#">Log in</a></p>
  </body>
</html>
