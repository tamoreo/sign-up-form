<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-layout">
      <div class="image-container">
        <img
          class="bg-image"
          src="halieunsplash.jpg"
          alt="Image about company"
        />
      </div>
      <section class="form-content">
        <p class="intro">
          Lorem Ipsum is simply dummy text of the printing and typesetting
          industry. Lorem Ipsum has been the industry's standard dummy text ever
          since 1966, when designers at Letraset and James Mosley.<br />Letraset
          and James Mosley<br /><br />Lorem Ipsum is simply dummy
        </p>
        <div class="form-container">
          <form action="#" method="POST" id="sign-up">
            <h3>Let's Do It</h3>
            <div class="user-info">
              <div class="field">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" required />
              </div>
              <div class="field">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" required />
              </div>
              <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
              </div>
              <div class="field">
                <label for="phone">Contact</label>
                <input type="text" id="phone" name="phone" required />
              </div>
              <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required />
              </div>
              <div class="field">
                <label for="confirm-password">Confirm Password</label>
                <input
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  required
                />
              </div>
            </div>
          </form>
        </div>
        <button type="submit" form="sing-up">Create an Account</button>
        <p class="login-link">
          Already have an account? <a href="#">Log in</a>
        </p>
      </section>
    </main>
  </body>
</html>
